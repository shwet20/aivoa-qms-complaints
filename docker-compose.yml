version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qms_db
    environment:
      POSTGRES_USER: qms_user
      POSTGRES_PASSWORD: qms_password
      POSTGRES_DB: qms_complaints
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: